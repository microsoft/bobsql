<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3C6088"/>
    </marker>
  </defs>

  <!-- gray panel background -->
  <rect x="0" y="0" width="1280" height="720" rx="20" fill="#E9ECF1"/>

  <!-- Title -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0A2342">Model Context Protocol (MCP)</text>
  <text x="40" y="84" font-size="16.5" fill="#4A5568">The model <tspan font-weight="700">selects</tspan> a tool; the client <tspan font-weight="700">calls</tspan> it; the server <tspan font-weight="700">runs</tspan> it — over one open protocol.</text>

  <!-- USB-C quote (upper right) -->
  <rect x="838" y="26" width="402" height="66" rx="12" fill="#EAF3FB" stroke="#1565C0" stroke-width="1.5"/>
  <text x="858" y="54" font-size="15" font-weight="700" font-style="italic" fill="#0D47A1">&#10077; MCP is the USB-C of AI &#10078;</text>
  <text x="858" y="77" font-size="12" fill="#33415C">one open protocol — plug any AI host into any tool</text>

  <!-- ===================== Hosts (left) — model + its three-prompt context ===================== -->
  <text x="165" y="150" font-size="13" font-weight="700" fill="#5A6B85" text-anchor="middle">HOSTS (client apps)</text>

  <!-- Host 1 -->
  <rect x="40" y="162" width="250" height="120" rx="12" fill="#E8F0FE" stroke="#1864AB" stroke-width="2"/>
  <text x="165" y="186" font-size="14" font-weight="700" fill="#0A2342" text-anchor="middle">GitHub Copilot</text>
  <rect x="56" y="196" width="92" height="26" rx="6" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
  <text x="102" y="214" font-size="11" font-weight="700" fill="#4527A0" text-anchor="middle">AI model</text>
  <text x="156" y="214" font-size="9.5" fill="#5A6B85">selects a tool + args</text>
  <rect x="54" y="244" width="72" height="30" rx="6" fill="#E8F0FE" stroke="#1864AB" stroke-width="1.4"/>
  <text x="90" y="263" font-size="10.5" font-weight="600" fill="#0D3B66" text-anchor="middle">System</text>
  <rect x="130" y="244" width="54" height="30" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
  <text x="157" y="263" font-size="10.5" font-weight="600" fill="#1B5E20" text-anchor="middle">User</text>
  <rect x="188" y="244" width="94" height="30" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="235" y="263" font-size="10.5" font-weight="700" fill="#BF360C" text-anchor="middle">Tools ✓</text>

  <!-- Host 2 -->
  <rect x="40" y="292" width="250" height="120" rx="12" fill="#E8F0FE" stroke="#1864AB" stroke-width="2"/>
  <text x="165" y="316" font-size="14" font-weight="700" fill="#0A2342" text-anchor="middle">Custom app</text>
  <rect x="56" y="326" width="92" height="26" rx="6" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
  <text x="102" y="344" font-size="11" font-weight="700" fill="#4527A0" text-anchor="middle">AI model</text>
  <text x="156" y="344" font-size="9.5" fill="#5A6B85">selects a tool + args</text>
  <rect x="54" y="374" width="72" height="30" rx="6" fill="#E8F0FE" stroke="#1864AB" stroke-width="1.4"/>
  <text x="90" y="393" font-size="10.5" font-weight="600" fill="#0D3B66" text-anchor="middle">System</text>
  <rect x="130" y="374" width="54" height="30" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
  <text x="157" y="393" font-size="10.5" font-weight="600" fill="#1B5E20" text-anchor="middle">User</text>
  <rect x="188" y="374" width="94" height="30" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="235" y="393" font-size="10.5" font-weight="700" fill="#BF360C" text-anchor="middle">Tools ✓</text>

  <!-- Host 3 -->
  <rect x="40" y="422" width="250" height="120" rx="12" fill="#E8F0FE" stroke="#1864AB" stroke-width="2"/>
  <text x="165" y="446" font-size="14" font-weight="700" fill="#0A2342" text-anchor="middle">Another AI agent</text>
  <rect x="56" y="456" width="92" height="26" rx="6" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
  <text x="102" y="474" font-size="11" font-weight="700" fill="#4527A0" text-anchor="middle">AI model</text>
  <text x="156" y="474" font-size="9.5" fill="#5A6B85">selects a tool + args</text>
  <rect x="54" y="504" width="72" height="30" rx="6" fill="#E8F0FE" stroke="#1864AB" stroke-width="1.4"/>
  <text x="90" y="523" font-size="10.5" font-weight="600" fill="#0D3B66" text-anchor="middle">System</text>
  <rect x="130" y="504" width="54" height="30" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.4"/>
  <text x="157" y="523" font-size="10.5" font-weight="600" fill="#1B5E20" text-anchor="middle">User</text>
  <rect x="188" y="504" width="94" height="30" rx="6" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="235" y="523" font-size="10.5" font-weight="700" fill="#BF360C" text-anchor="middle">Tools ✓</text>

  <!-- Tool catalog (client-side, built from tools/list) -->
  <rect x="470" y="96" width="340" height="54" rx="10" fill="#FFFFFF" stroke="#1565C0" stroke-width="1.5"/>
  <text x="486" y="118" font-size="12" font-weight="700" fill="#0D47A1">Tools prompt — built by the protocol</text>
  <text x="486" y="137" font-size="10.5" fill="#33415C">tools/list merged from every server → the model selects from here</text>

  <!-- ===================== MCP bus (center) ===================== -->
  <rect x="540" y="162" width="200" height="372" rx="16" fill="#EAF3FB" stroke="#0A2342" stroke-width="2.5"/>
  <text x="640" y="202" font-size="30" font-weight="700" fill="#0A2342" text-anchor="middle">MCP</text>
  <text x="640" y="225" font-size="12.5" fill="#33415C" text-anchor="middle">Model Context Protocol</text>

  <rect x="562" y="250" width="156" height="52" rx="9" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
  <text x="640" y="272" font-size="13.5" font-weight="700" fill="#0D47A1" text-anchor="middle">discover</text>
  <text x="640" y="290" font-size="11.5" fill="#33415C" text-anchor="middle" font-family="Consolas, monospace">tools/list</text>

  <rect x="562" y="316" width="156" height="52" rx="9" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
  <text x="640" y="338" font-size="13.5" font-weight="700" fill="#1B5E20" text-anchor="middle">execute</text>
  <text x="640" y="356" font-size="11.5" fill="#33415C" text-anchor="middle" font-family="Consolas, monospace">tools/call</text>

  <text x="640" y="404" font-size="11.5" fill="#5A6B85" text-anchor="middle" font-family="Consolas, monospace">JSON-RPC 2.0</text>
  <text x="640" y="424" font-size="11.5" fill="#5A6B85" text-anchor="middle" font-family="Consolas, monospace">HTTP or stdio</text>
  <text x="640" y="508" font-size="11.5" fill="#33415C" text-anchor="middle">one client · one server</text>

  <!-- host -> bus connectors (clean, M) — from each host's TOOLS prompt -->
  <g stroke="#3C6088" stroke-width="2" fill="none">
    <line x1="282" y1="259" x2="538" y2="272" marker-end="url(#a2)"/>
    <line x1="282" y1="389" x2="538" y2="341" marker-end="url(#a2)"/>
    <line x1="282" y1="519" x2="538" y2="410" marker-end="url(#a2)"/>
  </g>

  <!-- bus -> tool connectors (clean, N) -->
  <g stroke="#3C6088" stroke-width="2" fill="none">
    <line x1="742" y1="272" x2="1018" y2="216" marker-end="url(#a2)"/>
    <line x1="742" y1="341" x2="1018" y2="341" marker-end="url(#a2)"/>
    <line x1="742" y1="410" x2="1018" y2="466" marker-end="url(#a2)"/>
  </g>

  <!-- ===================== Tools (right) ===================== -->
  <text x="1130" y="150" font-size="13" font-weight="700" fill="#5A6B85" text-anchor="middle">TOOLS (MCP servers)</text>
  <g>
    <rect x="1020" y="175" width="220" height="82" rx="12" fill="#FFF3E0" stroke="#E65100" stroke-width="2.5"/>
    <text x="1130" y="205" font-size="15" font-weight="700" fill="#BF360C" text-anchor="middle">SQL database</text>
    <text x="1130" y="226" font-size="11.5" fill="#33415C" text-anchor="middle">via DAB · SQL MCP Server</text>
    <text x="1130" y="245" font-size="11" fill="#8A5A2B" text-anchor="middle">no model-written SQL (NL2DAB)</text>

    <rect x="1020" y="300" width="220" height="82" rx="12" fill="#EEF2F7" stroke="#869397" stroke-width="2"/>
    <text x="1130" y="333" font-size="15" font-weight="700" fill="#0A2342" text-anchor="middle">REST / web API</text>
    <text x="1130" y="355" font-size="11.5" fill="#33415C" text-anchor="middle">MCP server</text>

    <rect x="1020" y="425" width="220" height="82" rx="12" fill="#EEF2F7" stroke="#869397" stroke-width="2"/>
    <text x="1130" y="458" font-size="15" font-weight="700" fill="#0A2342" text-anchor="middle">Files / storage</text>
    <text x="1130" y="480" font-size="11.5" fill="#33415C" text-anchor="middle">MCP server</text>
  </g>

  <!-- ===================== bottom callout ===================== -->
  <rect x="40" y="556" width="1200" height="120" rx="12" fill="#EEF7EE" stroke="#9CC79C" stroke-width="1.5"/>
  <text x="60" y="584" font-size="15" font-weight="700" fill="#1B5E20">On connect, every MCP client (Copilot, Claude, ChatGPT, Cursor…) calls tools/list on each server → the Tools prompt is built by the protocol, not by hand.</text>
  <text x="60" y="609" font-size="13.5" fill="#2C4A2C">Same three prompts — System + User + Tools — but now the Tools prompt is standard: each server publishes its own name, description + JSON schema.</text>
  <text x="60" y="631" font-size="13.5" fill="#2C4A2C">Per prompt: the model picks a tool by its description → the client calls it (tools/call) → the server executes it → result to the model. M + N, not M × N.</text>
  <text x="60" y="653" font-size="13.5" fill="#2C4A2C">Expose your database as an MCP server with DAB — every MCP host can discover and use it, no custom glue.</text>
</svg>
