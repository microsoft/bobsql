<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
  <!-- Dark panel background -->
  <rect x="0" y="0" width="1280" height="720" rx="20" fill="#0C2340"/>

  <!-- Title -->
  <text x="40" y="50" font-size="30" font-weight="700" fill="#FFFFFF">SQL MCP Server — the published tools</text>
  <text x="40" y="80" font-size="16" fill="#AFC2DA">Data API builder exposes these built-in tools over MCP. Every call is RBAC-checked and NL2DAB — the model sends typed arguments; DAB generates the parameterized T-SQL.</text>

  <!-- ============================= ROW 1 ============================= -->

  <!-- describe_entities (teal / discovery) — the model's grounding step, emphasized -->
  <rect x="34" y="114" width="297" height="162" rx="16" fill="none" stroke="#FFC107" stroke-width="3.5"/>
  <rect x="40" y="120" width="285" height="150" rx="12" fill="#FFFFFF" stroke="#00838F" stroke-width="2.5"/>
  <rect x="40" y="120" width="285" height="32" rx="12" fill="#E0F7FA"/>
  <text x="176" y="141" font-size="15" font-weight="700" fill="#006064" text-anchor="middle" font-family="Consolas, monospace">describe_entities</text>
  <text x="306" y="142" font-size="15" fill="#FFB300" text-anchor="middle">&#9733;</text>
  <text x="56" y="174" font-size="11.5" fill="#33415C">Returns every entity, field &amp; param —</text>
  <text x="56" y="191" font-size="11.5" font-weight="700" fill="#006064">each with its rich description.</text>
  <rect x="56" y="203" width="253" height="21" rx="6" fill="#FFF8E1" stroke="#FFB300" stroke-width="1.2"/>
  <text x="64" y="218" font-size="10" font-weight="700" fill="#8A6D00">The model's grounding — richer = better answers</text>
  <rect x="56" y="230" width="253" height="21" rx="6" fill="#E8F5E9"/>
  <text x="64" y="245" font-size="10.5" font-weight="600" fill="#1B5E20">no SQL — in-memory config read</text>

  <!-- read_records (blue / read) -->
  <rect x="340" y="120" width="285" height="150" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
  <rect x="340" y="120" width="285" height="32" rx="12" fill="#E3F2FD"/>
  <text x="482" y="141" font-size="15" font-weight="700" fill="#0D47A1" text-anchor="middle" font-family="Consolas, monospace">read_records</text>
  <text x="356" y="180" font-size="11.5" fill="#33415C">Reads rows with filter, select,</text>
  <text x="356" y="200" font-size="11.5" fill="#33415C">order, and pagination.</text>
  <rect x="356" y="222" width="168" height="24" rx="6" fill="#E3F2FD"/>
  <text x="364" y="238" font-size="10.5" font-weight="600" fill="#0D47A1">parameterized SELECT</text>

  <!-- aggregate_records (blue / read) -->
  <rect x="640" y="120" width="285" height="150" rx="12" fill="#FFFFFF" stroke="#1565C0" stroke-width="2"/>
  <rect x="640" y="120" width="285" height="32" rx="12" fill="#E3F2FD"/>
  <text x="782" y="141" font-size="15" font-weight="700" fill="#0D47A1" text-anchor="middle" font-family="Consolas, monospace">aggregate_records</text>
  <text x="656" y="180" font-size="11.5" fill="#33415C">Aggregations — count, sum, avg,</text>
  <text x="656" y="200" font-size="11.5" fill="#33415C">min, max, group-by.</text>
  <rect x="656" y="222" width="168" height="24" rx="6" fill="#E3F2FD"/>
  <text x="664" y="238" font-size="10.5" font-weight="600" fill="#0D47A1">parameterized SELECT</text>

  <!-- execute_entity (purple / proc) -->
  <rect x="940" y="120" width="285" height="150" rx="12" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="2"/>
  <rect x="940" y="120" width="285" height="32" rx="12" fill="#F3E5F5"/>
  <text x="1082" y="141" font-size="15" font-weight="700" fill="#4A148C" text-anchor="middle" font-family="Consolas, monospace">execute_entity</text>
  <text x="956" y="180" font-size="11.5" fill="#33415C">Runs a stored-procedure entity</text>
  <text x="956" y="200" font-size="11.5" fill="#33415C">with typed parameters.</text>
  <rect x="956" y="222" width="120" height="24" rx="6" fill="#F3E5F5"/>
  <text x="964" y="238" font-size="10.5" font-weight="600" fill="#4A148C" font-family="Consolas, monospace">EXEC proc</text>

  <!-- ============================= ROW 2 ============================= -->

  <!-- create_record (amber / write) -->
  <rect x="40" y="292" width="285" height="150" rx="12" fill="#FFFFFF" stroke="#B26A00" stroke-width="2"/>
  <rect x="40" y="292" width="285" height="32" rx="12" fill="#FFF3E0"/>
  <text x="182" y="313" font-size="15" font-weight="700" fill="#8A4B00" text-anchor="middle" font-family="Consolas, monospace">create_record</text>
  <text x="56" y="352" font-size="11.5" fill="#33415C">Inserts a new row into a table.</text>
  <rect x="56" y="396" width="170" height="24" rx="6" fill="#FFF3E0"/>
  <text x="64" y="412" font-size="10.5" font-weight="600" fill="#8A4B00">parameterized INSERT</text>

  <!-- update_record (amber / write) -->
  <rect x="340" y="292" width="285" height="150" rx="12" fill="#FFFFFF" stroke="#B26A00" stroke-width="2"/>
  <rect x="340" y="292" width="285" height="32" rx="12" fill="#FFF3E0"/>
  <text x="482" y="313" font-size="15" font-weight="700" fill="#8A4B00" text-anchor="middle" font-family="Consolas, monospace">update_record</text>
  <text x="356" y="352" font-size="11.5" fill="#33415C">Updates existing row(s), matched</text>
  <text x="356" y="372" font-size="11.5" fill="#33415C">by primary key.</text>
  <rect x="356" y="396" width="176" height="24" rx="6" fill="#FFF3E0"/>
  <text x="364" y="412" font-size="10.5" font-weight="600" fill="#8A4B00">parameterized UPDATE</text>

  <!-- delete_record (amber / write) -->
  <rect x="640" y="292" width="285" height="150" rx="12" fill="#FFFFFF" stroke="#B26A00" stroke-width="2"/>
  <rect x="640" y="292" width="285" height="32" rx="12" fill="#FFF3E0"/>
  <text x="782" y="313" font-size="15" font-weight="700" fill="#8A4B00" text-anchor="middle" font-family="Consolas, monospace">delete_record</text>
  <text x="656" y="352" font-size="11.5" fill="#33415C">Deletes row(s), matched by</text>
  <text x="656" y="372" font-size="11.5" fill="#33415C">primary key.</text>
  <rect x="656" y="396" width="172" height="24" rx="6" fill="#FFF3E0"/>
  <text x="664" y="412" font-size="10.5" font-weight="600" fill="#8A4B00">parameterized DELETE</text>

  <!-- governance note card (slate) -->
  <rect x="940" y="292" width="285" height="150" rx="12" fill="#163A5E" stroke="#5AA0E0" stroke-width="2"/>
  <rect x="940" y="292" width="285" height="32" rx="12" fill="#1E4C77"/>
  <text x="1082" y="313" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Every call is governed</text>
  <text x="956" y="352" font-size="11.5" fill="#D5E3F2">① Authorize (RBAC) runs first —</text>
  <text x="956" y="372" font-size="11.5" font-weight="600" fill="#FF9E9E">denied before any SQL.</text>
  <text x="956" y="398" font-size="11.5" fill="#D5E3F2">Tool availability per entity</text>
  <text x="956" y="418" font-size="11.5" fill="#D5E3F2">follows its permissions.</text>

  <!-- write-safety pill (spans the three write cards) -->
  <rect x="40" y="447" width="885" height="21" rx="7" fill="#FFF3E0" stroke="#B26A00" stroke-width="1.3"/>
  <text x="482" y="462" font-size="11" font-weight="700" fill="#8A4B00" text-anchor="middle"><tspan font-family="Consolas, monospace">update_record</tspan> / <tspan font-family="Consolas, monospace">delete_record</tspan> require the primary key (keys) — no unbounded UPDATE or DELETE</text>

  <!-- ============================= CUSTOM TOOLS BOX ============================= -->
  <rect x="40" y="470" width="1185" height="212" rx="14" fill="#12345A" stroke="#3C5A7C" stroke-width="2"/>

  <text x="62" y="506" font-size="21" font-weight="700" fill="#FFFFFF">Extend the catalog — add your own tools</text>
  <rect x="1055" y="488" width="150" height="26" rx="8" fill="#F3E5F5"/>
  <text x="1130" y="506" font-size="12" font-weight="700" fill="#4A148C" text-anchor="middle" font-family="Consolas, monospace">mcp.custom-tool</text>

  <text x="62" y="546" font-size="14.5" fill="#D5E3F2"><tspan font-weight="700" fill="#FFFFFF">Custom (named) tools</tspan> — expose a stored procedure as an entity with <tspan font-family="Consolas, monospace" fill="#E6D3F2">mcp.custom-tool: true</tspan> and it becomes its</text>
  <text x="62" y="570" font-size="14.5" fill="#D5E3F2">   OWN named tool — the entity name in snake_case (<tspan font-family="Consolas, monospace" fill="#E6D3F2">GetWhereUsedProduct</tspan> &#8594; <tspan font-family="Consolas, monospace" fill="#E6D3F2">get_where_used_product</tspan>), self-describing at connect.</text>

  <text x="62" y="602" font-size="14.5" fill="#D5E3F2"><tspan font-weight="700" fill="#FFFFFF">More entities</tspan> — add tables / views / procs to <tspan font-family="Consolas, monospace" fill="#BFE3FF">dab-config.json</tspan> and the built-in tools above reach them too.</text>

  <text x="62" y="634" font-size="14.5" fill="#D5E3F2"><tspan font-weight="700" fill="#FFFFFF">One config, still RBAC-gated</tspan> — every new tool inherits the same <tspan font-weight="600" fill="#FFFFFF">① Authorize</tspan> checks.</text>

  <rect x="62" y="648" width="560" height="24" rx="6" fill="#FFF8E1"/>
  <text x="342" y="664" font-size="12.5" font-weight="700" fill="#6B5300" text-anchor="middle">NL2DAB throughout — the model never writes SQL.</text>
</svg>
