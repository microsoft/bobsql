<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caldova | SQL and AI inside Azure Local</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07182f; --surface: #0b213d; --card: #102b4b;
      --border: #345679; --wire: #8badcf; --text: #f3f8ff;
      --soft: #c4d8ef; --blue: #50b9ff; --mint: #7ce5cb; --grid: #183450;
      --avd: #c4a0ff; --vm: #54d6c7; --sql: #69b8ff; --foundry: #ffc16f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", Aptos, Calibri, sans-serif; }
    .shell { margin: auto; height: 100dvh; display: flex; flex-direction: column; }
    header { margin-bottom: 8px; }
    h1 { margin: 0; font-size: 32px; letter-spacing: -.035em; }
    .subtitle { margin: 4px 0 0; font-size: 12px; color: var(--blue); }
    .navigation { flex: none; display: grid; gap: 4px; padding: 6px 12px; }
    nav { display: grid; gap: 6px; }
    .chapter-nav { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 10px 14px; cursor: pointer; }
    button:hover, button[aria-current] { border-color: var(--blue); background: #0a2b50; }
    button:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
    nav button { text-align: left; padding: 6px 8px; font-size: 12px; line-height: 1.25; }
    .chapter-nav button:nth-child(1) { --button-color: var(--sql); }
    .chapter-nav button:nth-child(2) { --button-color: var(--vm); }
    .chapter-nav button:nth-child(3) { --button-color: var(--foundry); }
    .chapter-nav button:nth-child(4) { --button-color: var(--avd); }
    .chapter-nav button:nth-child(5) { --button-color: #ff9bb5; }
    .chapter-nav button { color: var(--button-color); border-color: var(--button-color); background: transparent; }
    .chapter-nav button:hover { background: var(--card); }
    .chapter-nav button[aria-current] { color: var(--bg); background: var(--button-color); font-weight: 650; }
    .workspace { position: relative; flex: 1; min-height: 0; }
    .stage { background: var(--surface); overflow: hidden; height: 100%; display: flex; align-items: center; }
    svg { display: block; width: 100%; height: 100%; aspect-ratio: 1720 / 900; }
    .caption { overflow: visible; }
    aside { margin: 0; text-align: center; }
    .counter { color: var(--blue); font: 11px/14px Consolas, monospace; letter-spacing: .08em; }
    svg text { fill: var(--text); }
    .card { fill: var(--card); stroke: var(--border); stroke-width: 2; }
    .outer { fill: #0a1d36; stroke: var(--border); stroke-width: 2; }
    .pill { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
    #cloud, #local-control { --node-accent: var(--avd); --node-fill: #201830; --node-highlight: #312344; }
    #avd, #app { --node-accent: var(--vm); --node-fill: #09262d; --node-highlight: #0c3740; }
    #sql { --node-accent: var(--sql); --node-fill: #0a213b; --node-highlight: #103653; }
    #foundry { --node-accent: var(--foundry); --node-fill: #2b2113; --node-highlight: #44331b; }
    #cloud > rect, #local-control > rect, #avd > rect, #app > rect, #sql > rect, #foundry > rect { stroke: var(--node-accent); fill: var(--node-fill); }
    .label { font-size: 16px; fill: var(--node-accent, var(--blue)); font-weight: 650; letter-spacing: 1px; }
    .title { font-size: 27px; font-weight: 650; letter-spacing: -.5px; }
    .detail { fill: var(--soft); font-size: 19px; }
    .small { fill: var(--soft); font-size: 16px; }
    .mint { fill: var(--mint); }
    .focus > rect:first-child { stroke: var(--node-accent, var(--mint)); stroke-width: 3; fill: var(--node-highlight, #0c3045); }
    .avd-color { fill: var(--avd); }
    .vm-color { fill: var(--vm); }
    .sql-color { fill: var(--sql); }
    .foundry-color { fill: var(--foundry); }
    .color-key text { font-size: 13px; fill: var(--soft); }
    .dim { opacity: .72; }
    .concealed { opacity: .08; }
    .wire { fill: none; stroke: var(--wire); stroke-width: 2.5; opacity: .2; }
    .wire.active { opacity: 1; stroke: var(--mint); }
    .control-wire { fill: none; stroke: var(--blue); stroke-width: 2; stroke-dasharray: 6 8; }
    #avd-control .control-wire, #local-control .control-wire { stroke: var(--avd); }
    .packet { fill: var(--mint); filter: drop-shadow(0 0 4px #7ce5cb70); }
    .hidden { display: none; }
    [data-export="true"]:not([data-buttons="true"]) .navigation { display: none; }
    @media (max-width: 740px) {
      .shell { height: auto; min-height: 100dvh; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
      .workspace { display: flex; flex-direction: column; gap: 12px; }
      svg { height: auto; }
      nav { grid-template-columns: 1fr 1fr; order: 2; }
      .navigation { padding: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="workspace">
      <section class="stage" aria-label="Animated Caldova architecture">
        <svg id="diagram" viewBox="0 0 1720 900" role="img" aria-labelledby="diagram-title diagram-desc">
          <title id="diagram-title">Caldova architecture and data flows</title>
          <desc id="diagram-desc">In the connected architecture, the Azure portal and control plane run in the public cloud, outside Azure Local. The user remotes into an Azure Virtual Desktop session host VM on Azure Local. Both the browser and the ASP.NET Core Transfer Center application run inside that VM. The Azure-hosted AVD service provides connection brokering; the session host runs locally. The application calls SQL Server 2025 on an Azure Local VM with Windows Server 2025. A standalone vector search previews patient history. For briefing generation, an optional includeHistory flag makes SQL retrieve up to three filtered historical notes using the current transfer concern, validate and snapshot their text, and invoke the approved ReceivingBriefing 2.0 skill through a separate local generative model. SQL records completed briefing interactions in append-only ledger. In the separately provisioned disconnected architecture, the local Azure portal and control plane run inside Azure Local; Azure-hosted AVD access is not depicted.</desc>

  <script>
    const chapters = [
      {
        id: "overview", file: "01-overview", title: "The complete architecture", label: "01 | Overview",
        work: ["Governed stored procedures", "Grounding, model calls, validation, provenance", "The browser does not call either model"],
        store: ["Vectors + results + ledger", "Persisted in the database"],
        summary: {
          title: "The complete architecture",
          text: "The Azure portal and control plane run in the public cloud, outside Azure Local. The user remotes into an AVD session host VM on Azure Local, where both the browser and Transfer Center app run. SQL Server 2025 runs on an Azure Local VM with Windows Server 2025 and owns the records, approved skills, vector retrieval, model calls, saved briefings, and ledger audit. Nemotron and gpt-oss-20b run on AKS on Azure Local, powered by GPUs. Azure provides Arc management and AVD connection brokering.",
          takeaway: "Remote access and cloud management; local desktop, application, SQL, and inference.",
          focus: ["client","avd","cloud","app","app-patient","app-history","app-result","sql","records","work","store","foundry","embedding","chat"],
          flows: ["client-avd","avd-app","app-sql","sql-app","records-work","work-store","store-work","sql-embed","embed-sql","sql-chat","chat-sql","audit-read"],
          payload: "AVD VM [browser + app] -> SQL -> local models | Saved results + ledger"
        },
        steps: [
          { title: "Enter through Azure Virtual Desktop", text: "The user remotes into an Azure Virtual Desktop (AVD) session host VM on Azure Local. Both the browser and the ASP.NET Core Transfer Center app run inside that same VM. Azure's AVD service provides connection brokering.", takeaway: "Remote user device; local AVD VM containing both browser and app.", focus: ["client","avd","app","app-patient"], flows: ["client-avd","avd-app"], payload: "User device -> AVD VM on Azure Local [browser + Transfer Center app]", duration: 5500 },
          { title: "SQL owns the workflow", text: "SQL Server holds patient records, historical notes, approved skills, vectors, briefings, and the audit history.", takeaway: "The application delegates data and AI orchestration to SQL.", focus: ["app","sql","records","work","store"], flows: ["app-sql","records-work","sql-app"], payload: "Application queries and stored procedure calls", duration: 4500 },
          { title: "Two local models.\nTwo different jobs.", text: "Nemotron generates embeddings for retrieval. gpt-oss-20b produces briefings from supplied evidence. SQL calls both through local HTTPS endpoints.", takeaway: "Patient records and inference requests stay local.", focus: ["sql","foundry","embedding","chat"], flows: ["sql-embed","embed-sql","sql-chat","chat-sql"], payload: "SQL -> local embedding and generative models", duration: 5500 },
          { title: "Connected management", text: "The Azure portal and control plane run outside Azure Local in the public cloud. Azure Arc provides management connectivity. Azure's AVD service brokers connections to the session host on Azure Local. The desktop session, application, SQL, and model inference run locally.", takeaway: "Cloud portal, control plane, and brokering; local session hosts and inference.", focus: ["client","avd","cloud","app","sql","foundry"], flows: ["app-sql","sql-embed","chat-sql"], payload: "Azure: portal + control plane + AVD | Azure Local: app + SQL + AI", duration: 5000 }

          takeaway: "SQL retrieves existing notes; the embedding model does not generate patient facts.",

          flows: ["client-avd","avd-app","app-sql","records-work","sql-embed","embed-sql","work-store","store-work","sql-app"],

        steps: [
          { title: "Open an incoming transfer", text: "From the browser in the local AVD session, the application queries SQL for this patient's current transfer facts, observations, medications, allergies, and narratives.", takeaway: "Ordinary SQL queries supply current patient information.", focus: ["client","avd","app","app-patient","records"], flows: ["client-avd","avd-app","app-sql"], payload: "Local desktop session -> application -> patient / transfer query", duration: 4000 },
